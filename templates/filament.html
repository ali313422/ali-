<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Filament - رندر واقعي (تجريبي)</title>
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body class="designer-page">
  <div class="page-shell" style="padding-top:14px">
    <header class="topbar">
      <a class="brand" href="/dashboard">
        <span class="logo-mark">K</span>
        <span>Filament (تجريبي)</span>
      </a>
      <nav class="top-actions">
        <a class="pill-link" href="/designer">الرجوع للمصمم</a>
        <a class="pill-link" href="/dashboard">الرئيسية</a>
      </nav>
    </header>

    <section class="glass-card" style="padding:16px; display:grid; gap:12px">
      <p class="muted" style="margin:0">
        هذه صفحة تجريبية لدمج محرك الرندر <strong>Filament</strong> على الويب. تحتاج ملفات Filament (WASM/JS) داخل مجلد

      </p>
      <canvas id="filamentCanvas" style="width:100%; height:70vh; border-radius:18px; border:1px solid rgba(255,255,255,0.12); background:#0b111c"></canvas>
      <div class="muted" id="filamentStatus">لم يتم تحميل Filament بعد.</div>
    </section>
  </div>

  <script src="/static/filament/filament.js"></script>
  <script src="/static/js/filament-viewer.js" defer></script>

</html>
