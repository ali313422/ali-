<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>كلمة مرور جديدة</title>
  <link rel="stylesheet" href="/static/css/app.css?v=brand4">
</head>
<body class="auth-page corner-brand">
  <main class="auth-layout">
    <div class="auth-hero-spacer" aria-hidden="true"></div>
    <div class="auth-shell">
      <section class="auth-card glass-card">
        <h1 style="text-align:center;margin:0 0 0.5rem">كلمة مرور جديدة</h1>
        {{ERROR}}
        <form action="/reset-password" method="post" class="form-stack">
          <input type="hidden" name="token" value="{{TOKEN}}">
          <label>
            <span>كلمة المرور الجديدة</span>
            <input name="password" type="password" minlength="4" required autocomplete="new-password">
          </label>
          <label>
            <span>تأكيد كلمة المرور</span>
            <input name="password_confirm" type="password" minlength="4" required autocomplete="new-password">
          </label>
          <button class="btn primary" type="submit">حفظ والدخول</button>
        </form>
        <p class="muted" style="text-align:center;margin-top:1rem">
          <a href="/forgot-password">طلب رابط جديد</a> ·
          <a href="/login">تسجيل الدخول</a>
        </p>
      </section>
    </div>
  </main>
</body>
</html>
